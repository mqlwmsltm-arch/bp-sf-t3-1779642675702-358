<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="401" cy="251" r="98" fill="#9a3412" opacity="0.13"/>
    <circle cx="446" cy="-99" r="94" fill="#9a3412" opacity="0.07"/>
    <circle cx="519" cy="-67" r="22" fill="#9a3412" opacity="0.19"/>
    <circle cx="977" cy="-55" r="80" fill="#9a3412" opacity="0.07"/>
    <circle cx="192" cy="32" r="24" fill="#9a3412" opacity="0.12"/>
    <circle cx="1019" cy="680" r="21" fill="#9a3412" opacity="0.09"/>
    <rect x="76" y="18" width="50" height="29" rx="8" fill="#c2410c" opacity="0.09" transform="rotate(34, 1228, 342)"/>
    <rect x="110" y="448" width="94" height="74" rx="8" fill="#c2410c" opacity="0.06" transform="rotate(5, 1011, -7)"/>
    <rect x="1103" y="180" width="63" height="74" rx="8" fill="#c2410c" opacity="0.08" transform="rotate(7, 767, 404)"/>
    <rect x="1088" y="650" width="68" height="38" rx="8" fill="#c2410c" opacity="0.06" transform="rotate(21, 710, 212)"/>
    <rect x="852" y="100" width="27" height="77" rx="8" fill="#c2410c" opacity="0.06" transform="rotate(27, -17, 151)"/>
    <rect x="1134" y="33" width="23" height="74" rx="8" fill="#c2410c" opacity="0.03" transform="rotate(3, 961, -84)"/>
    <rect x="397" y="80" width="90" height="39" rx="8" fill="#c2410c" opacity="0.10" transform="rotate(18, 178, 598)"/>
    <rect x="754" y="428" width="27" height="45" rx="8" fill="#c2410c" opacity="0.04" transform="rotate(31, 712, 275)"/>
    <polygon points="28,481 82,589 -26,589" fill="#9a3412" opacity="0.05"/>
    <polygon points="-14,174 8,218 -36,218" fill="#9a3412" opacity="0.05"/>
    <polygon points="201,274 282,436 120,436" fill="#9a3412" opacity="0.10"/>
    <polygon points="1094,188 1191,382 997,382" fill="#9a3412" opacity="0.07"/>

  <!-- Wave at bottom -->
  <path d="M0,572 C360,601 840,543 1200,572 L1200,630 L0,630Z" fill="#9a3412" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 셔츠룸
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 힙플레이스 카페
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#fb923c" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#fb923c" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 마포 셔츠룸 — 힙플레이스 카페
  </text>
</svg>