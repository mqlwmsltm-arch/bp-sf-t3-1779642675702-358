        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #1a1a1a;
            --text-primary: #f0f0f0;

            --accent-brutal: #ff6600;

            --shadow-brutal: 8px 8px 0px rgba(0, 0, 0, 0.8);
            --font-header: 'Impact', 'Arial Black', sans-serif;
            --font-body: 'Courier New', 'Courier', monospace;
            --spacing-unit: 1.5rem;
            --max-width: 1200px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image:
                linear-gradient(45deg, rgba(255, 0, 102, 0.03) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(0, 255, 204, 0.03) 25%, transparent 25%);
            background-size: 40px 40px;
        }

        /* ---- 네비게이션 ---- */
        .nav-container {
            background-color: var(--bg-secondary);
            border-bottom: var(--border-thick) solid var(--border-brutal);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-brutal);
        }

        .nav-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem var(--spacing-unit);
        }

        .nav-logo {
            font-family: var(--font-header);
            font-size: 1.8rem;
            color: var(--accent-neon);
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 0.1em;
            text-shadow: 0 0 8px rgba(255, 0, 102, 0.6);
            transition: transform 0.2s;
        }

        .nav-logo:hover {
            transform: scale(1.05);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-primary);
            text-decoration: none;
            font-family: var(--font-body);
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.95rem;
            padding: 0.3rem 0.8rem;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            letter-spacing: 0.05em;
        }

        .nav-links a:hover {
            color: var(--accent-neon);
            border-color: var(--accent-neon);
            background-color: rgba(255, 0, 102, 0.1);
        }

        .nav-links a.active {
            color: var(--accent-neon);
            border-color: var(--accent-neon);
            background-color: rgba(255, 0, 102, 0.15);
        }

        /* 햄버거 메뉴 (hamburger-menu 패턴) */
        .hamburger-menu {
            display: none;
            flex-direction: column;
            cursor: pointer;
            background: none;
            border: none;
            padding: 8px;
            z-index: 1001;
        }

        .hamburger-menu span {
            display: block;
            width: 30px;
            height: 3px;
            background-color: var(--text-primary);
            margin: 4px 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .hamburger-menu.open span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }

        .hamburger-menu.open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger-menu.open span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

            align-items: center;

            color: var(--accent-neon);
        }

        .section-content a {
            color: var(--accent-neon2);
            text-decoration: underline;
            text-underline-offset: 3px;

            color: var(--accent-neon);
        }

        /* ---- 카드 그리드 (재사용) ---- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 2px solid var(--border-bratl);
            padding: 1.5rem;
            box-shadow: var(--shadow-brutal);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-neon2));
            opacity: 0.5;
        }

        .card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 0, 102, 0.15);
        }

        .card h3 {
            font-family: var(--font-header);
            font-size: 1.3rem;
            text-transform: uppercase;
            color: var(--accent-neon);
            margin-bottom: 0.75rem;
            letter-spacing: 0.05em;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .card .card-label {
            display: inline-block;
            font-family: var(--font-body);
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--accent-brutal);
            text-transform: uppercase;
            border: 1px solid var(--accent-brutal);
            padding: 0.2rem 0.6rem;
            margin-top: 0.8rem;
            letter-spacing: 0.1em;
        }

        /* ---- 정보 전용 스타일 (주소, 연락처 등) ---- */
        .info-block {
            background-color: var(--bg-card);
            border: 2px solid var(--border-bratl);
            padding: 2rem;
            margin-bottom: 1.5rem;

        }

        .info-block .info-title {
            font-family: var(--font-header);
            font-size: 1.4rem;
            text-transform: uppercase;
            color: var(--accent-neon);
            margin-bottom: 0.8rem;
            letter-spacing: 0.08em;
        }

        .info-block .info-detail {
            font-size: 1rem;
            color: var(--text-primary);
            line-height: 1.8;
        }

        .info-block .info-detail span {
            display: inline-block;
            background-color: rgba(255, 0, 102, 0.1);
            padding: 0.2rem 0.6rem;
            margin: 0.2rem 0;
            border-left: 3px solid var(--accent-neon);
        }

        .info-block .info-icon {
            display: inline-block;
            font-size: 1.5rem;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        /* ---- 카드 리스트 (지역 시그널) ---- */

            list-style: none;
            display: grid;

        }

            background: var(--bg-card);
            border: 1px solid #2a2a2a;
            padding: 1rem 1.2rem;
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: border-color 0.2s;
        }

        .local-signal-list li::before {
            content: '▸';
            color: var(--accent-neon);
            font-size: 1.2rem;
        }

        .local-signal-list li:hover {
